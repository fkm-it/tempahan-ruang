<style>
/* Reset + asas tipografi */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font-ui);
  font-size: var(--fs-md);
  line-height: 1.55;
  color: var(--ink);
  background: var(--canvas);
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--brand); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { color: var(--brand2); }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 650; color: var(--brand-900); margin: 0; line-height: 1.2; letter-spacing: .005em; }
h1 { font-size: var(--fs-3xl); }
h2 { font-size: var(--fs-2xl); }
h3 { font-size: var(--fs-xl); }
h4 { font-size: var(--fs-lg); }
p { margin: 0; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: var(--r-sm); }
::selection { background: var(--brand2-100); color: var(--brand-900); }

.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.i-sm { width: 16px; height: 16px; }
.i-lg { width: 26px; height: 26px; }
.i-fill { fill: currentColor; stroke: none; }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.muted { color: var(--muted); }
.small { font-size: var(--fs-sm); }
.xs { font-size: var(--fs-xs); }
.nowrap { white-space: nowrap; }
.mt-2 { margin-top: var(--sp-2); } .mt-3 { margin-top: var(--sp-3); } .mt-4 { margin-top: var(--sp-4); } .mt-6 { margin-top: var(--sp-6); } .mt-8 { margin-top: var(--sp-8); }
.row { display: flex; align-items: center; gap: var(--sp-3); }
.row-wrap { flex-wrap: wrap; }
.mb-2 { margin-bottom: var(--sp-2); }
.spread { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: var(--sp-3); }
.grow { flex: 1 1 auto; min-width: 0; }
.hidden { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* Splash (dipaparkan sebelum JS siap) */
.boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--grad-brand); color: var(--canvas); transition: opacity .4s ease; }
.boot.is-done { opacity: 0; pointer-events: none; }
.boot__inner { display: grid; justify-items: center; gap: var(--sp-4); }
.boot__name { font-family: var(--font-display); font-size: var(--fs-3xl); letter-spacing: .02em; }
.boot__tag { font-style: italic; opacity: .8; }
.boot .boot__logo { width: 96px; height: 96px; object-fit: contain; background: #fff; border-radius: 24px; padding: 6px; animation: kd-pulse 1.6s ease-in-out infinite; }
.boot .brand-star { width: 64px; height: 64px; color: rgba(255, 255, 255, .2); animation: kd-pulse 1.6s ease-in-out infinite; }
@keyframes kd-pulse { 50% { opacity: .55; transform: scale(.94); } }
@keyframes kd-spin { to { transform: rotate(360deg); } }
</style>
