<style>
/* ===== Kalendar ketersediaan ruang (modul tempahan) ===== */
.jd-page { width: min(1180px, 100%); margin: 0 auto; padding: var(--sp-6); }
.jd-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sp-4); flex-wrap: wrap; margin-bottom: var(--sp-5); }
.jd-head h1 { font-size: var(--fs-3xl, 1.875rem); }
.jd-head p { color: var(--muted); margin-top: var(--sp-1); max-width: 60ch; }
.jd-bar { display: flex; gap: var(--sp-3); flex-wrap: wrap; align-items: center; margin-bottom: var(--sp-4); }
.jd-bar .select, .jd-bar .input { width: auto; min-height: 40px; flex: 1 1 150px; min-width: 0; }
.jd-date { display: flex; align-items: center; gap: 4px; flex: 1 1 250px; min-width: 0; }
.jd-date .input { flex: 1 1 auto; }
.jd-legend { display: flex; gap: var(--sp-4); flex-wrap: wrap; font-size: var(--fs-xs); color: var(--muted); margin-bottom: var(--sp-4); align-items: center; }
.jd-legend i { display: inline-block; width: 14px; height: 10px; border-radius: 3px; vertical-align: middle; margin-right: 6px; }
.jd-group { margin-bottom: var(--sp-5); padding: 0; overflow: hidden; }
.jd-group__head { display: flex; justify-content: space-between; align-items: center; padding: var(--sp-3) var(--sp-5); background: var(--canvas-200); border-bottom: 1px solid var(--line); font-weight: 600; }
.jd-row { display: grid; grid-template-columns: minmax(150px, 230px) 1fr 84px; gap: var(--sp-2) var(--sp-4); align-items: center; padding: var(--sp-3) var(--sp-5); border-top: 1px solid var(--line); }
.jd-row:first-of-type { border-top: 0; }
.jd-room b { display: block; font-weight: 600; line-height: 1.3; }
.jd-room span { display: block; }
.jd-axis { position: relative; height: 16px; font-size: 11px; color: var(--muted); }
.jd-axis span { position: absolute; transform: translateX(-50%); }
.jd-axis span:first-child { transform: none; }
.jd-axis span:last-child { transform: translateX(-100%); }
.jd-track { position: relative; height: 30px; border-radius: 6px; cursor: pointer; border: 1px solid var(--line);
  background-color: var(--success-50);
  background-image: repeating-linear-gradient(90deg, transparent 0, transparent calc(12.5% - 1px), rgba(15, 23, 42, .08) calc(12.5% - 1px), rgba(15, 23, 42, .08) 12.5%); }
.jd-track.is-past { cursor: default; background-color: var(--canvas-200); }
.jd-track:focus-visible { outline: 3px solid var(--brand-ring); }
.jd-seg { position: absolute; top: 3px; bottom: 3px; border-radius: 4px; min-width: 4px; display: flex; align-items: center; overflow: hidden; padding: 0 6px; font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; text-decoration: none; }
.jd-seg.is-ok { background: var(--brand); }
.jd-seg.is-wait { background: repeating-linear-gradient(135deg, #D97706 0 6px, #F59E0B 6px 12px); color: #451A03; }
.jd-seg.is-done { background: #94A3B8; }
.jd-slots { grid-column: 2 / 3; font-size: var(--fs-xs); color: var(--muted); margin-top: -4px; }
.jd-free { color: var(--success); font-weight: 600; }
.jd-lg-ok { background: var(--brand); }
.jd-lg-wait { background: #F59E0B; }
.jd-lg-free { background: var(--success-50); border: 1px solid #BBF7D0; }
.jd-day { font-weight: 600; }
.jd-day.is-today { color: var(--brand); }
.jd-day.is-weekend { color: var(--danger); }
.jd-kv { display: grid; grid-template-columns: 120px 1fr; gap: 8px 12px; margin-top: var(--sp-4); font-size: var(--fs-sm); }
.jd-kv dt { color: var(--muted); }
.jd-kv dd { margin: 0; word-break: break-word; }
@media (max-width: 720px) {
  .jd-page { padding: var(--sp-4); }
  .jd-row { grid-template-columns: 1fr auto; padding: var(--sp-3) var(--sp-4); }
  .jd-row .jd-track, .jd-row .jd-axis, .jd-slots { grid-column: 1 / -1; }
  .jd-row .jd-axis-spacer { display: none; }
  .jd-row .jd-book { grid-row: 1; grid-column: 2; }
  .jd-head h1 { font-size: var(--fs-2xl); }
  .jd-kv { grid-template-columns: 1fr; gap: 2px; }
  .jd-kv dd { margin-bottom: 8px; }
}
</style>
<style>
/* ===== Slip tempahan (cetak) ===== */
#tp-print { display: none; }
@media print {
  @page { size: A4; margin: 14mm; }
  body.tp-printing > *:not(#tp-print) { display: none !important; }
  body.tp-printing #tp-print { display: block; }
  body.tp-printing { background: #fff !important; }
}
.slip { font-family: var(--font-ui); color: #0F172A; max-width: 720px; margin: 0 auto; border: 1px solid #CBD5E1; border-radius: 10px; overflow: hidden; }
.slip__head { background: var(--brand); color: #fff; padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.slip__head h1 { font-size: 18px; margin: 0; color: #fff; }
.slip__head p { margin: 2px 0 0; font-size: 12px; opacity: .9; }
.slip__body { padding: 20px 24px; }
.slip__title { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #64748B; margin: 0 0 6px; }
.slip__ref { font-size: 26px; font-weight: 700; letter-spacing: .02em; margin: 0; }
.slip__status { display: inline-block; margin-top: 8px; padding: 3px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #F0FDF4; color: #15803D; border: 1px solid #BBF7D0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.slip table { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: 13px; }
.slip th { text-align: left; width: 34%; color: #64748B; font-weight: 500; padding: 7px 10px 7px 0; vertical-align: top; border-top: 1px solid #E2E8F0; }
.slip td { padding: 7px 0; border-top: 1px solid #E2E8F0; font-weight: 500; }
.slip__note { margin-top: 18px; padding: 10px 12px; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 8px; font-size: 12px; color: #334155; }
.slip__foot { padding: 10px 24px 16px; font-size: 11px; color: #64748B; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* ===== Papan paparan (skrin TV / lobi) ===== */
.pp { min-height: 100vh; background: var(--brand-900); color: #fff; padding: clamp(16px, 2.5vw, 40px); display: flex; flex-direction: column; gap: clamp(16px, 2vw, 28px); }
.pp__top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.pp__brand { font-size: clamp(14px, 1.3vw, 20px); opacity: .8; font-weight: 600; }
.pp__title { color: #fff; font-size: clamp(24px, 3vw, 48px); font-weight: 700; line-height: 1.1; margin-top: 4px; }
.pp__date { font-size: clamp(14px, 1.4vw, 22px); opacity: .85; margin-top: 6px; }
.pp__right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.pp__stats { display: flex; gap: clamp(12px, 2vw, 28px); font-size: clamp(11px, 1vw, 15px); opacity: .85; text-transform: uppercase; letter-spacing: .06em; }
.pp__stats span { display: flex; flex-direction: column; align-items: flex-end; }
.pp__stats b { font-size: clamp(20px, 2.2vw, 34px); letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
.pp__clock { font-size: clamp(40px, 6vw, 96px); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.pp__sec h2 { color: #fff; font-size: clamp(14px, 1.3vw, 20px); text-transform: uppercase; letter-spacing: .1em; opacity: .75; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
.pp__dot { width: 12px; height: 12px; border-radius: 50%; background: #4ADE80; box-shadow: 0 0 0 4px rgba(74, 222, 128, .25); }
.pp__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: clamp(10px, 1.2vw, 18px); }
.pp__card { background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .16); border-radius: 14px; padding: clamp(14px, 1.4vw, 22px); min-width: 0; }
.pp__card.is-now { background: #fff; color: var(--brand-900); border-color: #fff; }
.pp__time { font-size: clamp(20px, 2vw, 32px); font-weight: 700; font-variant-numeric: tabular-nums; }
.pp__room { font-size: clamp(16px, 1.5vw, 24px); font-weight: 600; margin-top: 6px; overflow-wrap: anywhere; }
.pp__what { font-size: clamp(13px, 1.1vw, 18px); opacity: .85; margin-top: 4px; overflow-wrap: anywhere; }
.pp__empty { font-size: clamp(16px, 1.5vw, 24px); opacity: .7; padding: 24px 0; }
.pp__body { display: flex; flex-direction: column; gap: clamp(16px, 2vw, 28px); }
.pp__foot { margin-top: auto; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: clamp(12px, 1vw, 16px); opacity: .7; }
.pp__foot a { color: #fff; }
</style>
<script>
/*
 * Paparan khas modul tempahan:
 *   Kalendar ketersediaan (awam + admin), Semak / batal (awam), Slip tempahan (cetak), Papan paparan (TV / lobi).
 * Data: laluan tempahan.jadual / tempahan.semak / tempahan.batal (TempahanHooks.routes).
 * Halaman awam dwibahasa: teks BM ialah kunci kamus KD.i18n (kamus EN di hujung fail ini).
 */
(function (KD) {
  'use strict';
  const { html, qs, on, todayKey } = KD.utils;
  const { icon, toast, toastError, busy, fieldErrors, modal, skeletonList, errorState, empty, toneBadge } = KD.ui;
  const t = (s) => KD.t(s);
  const en = () => KD.i18n.lang() === 'en';

  const DAYS = { ms: ['Ahd', 'Isn', 'Sel', 'Rab', 'Kha', 'Jum', 'Sab'], en: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'] };
  const DAYS_LONG = { ms: ['Ahad', 'Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu'], en: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'] };
  const MONTHS = { ms: ['Jan', 'Feb', 'Mac', 'Apr', 'Mei', 'Jun', 'Jul', 'Ogo', 'Sep', 'Okt', 'Nov', 'Dis'], en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'] };
  const L = () => (en() ? 'en' : 'ms');
  const pad = (n) => String(n).padStart(2, '0');
  const keyOf = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parseKey = (k) => { const p = String(k).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
  const isKey = (k) => /^\d{4}-\d{2}-\d{2}$/.test(String(k || ''));
  const dayLabel = (k) => { const d = parseKey(k); return DAYS[L()][d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[L()][d.getMonth()] + ' ' + d.getFullYear(); };
  const longDay = (k) => { const d = parseKey(k); return DAYS_LONG[L()][d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[L()][d.getMonth()] + ' ' + d.getFullYear(); };
  const shortDay = (k) => { const d = parseKey(k); return DAYS[L()][d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[L()][d.getMonth()]; };
  const fmtKey = (k) => { const p = String(k || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : ''; };
  const fmtIso = (iso) => { const d = iso ? new Date(iso) : null; return d && !isNaN(d) ? fmtKey(keyOf(d)) + ', ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) : ''; };
  const mins = (hm) => { const p = String(hm || '0:0').split(':'); return Number(p[0]) * 60 + Number(p[1]); };
  const hm = (m) => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
  const STATUS_CLASS = { DILULUSKAN: 'is-ok', MENUNGGU: 'is-wait', SELESAI: 'is-done' };
  const STATUS_TEXT = { DILULUSKAN: 'Ditempah', MENUNGGU: 'Menunggu kelulusan', SELESAI: 'Selesai' };
  const isAdminLayout = () => !!(KD.router.current && KD.router.current.route.layout === 'admin');
  const top = () => (isAdminLayout() ? '' : (KD.views.publicTop ? KD.views.publicTop() : ''));
  const cfg = () => KD.config || {};

  /** Pautan borang tempahan berisi awal (admin → borang dalaman). */
  function bookHref(q) {
    const s = Object.keys(q).filter((k) => q[k]).map((k) => k + '=' + encodeURIComponent(q[k])).join('&');
    return '#' + (isAdminLayout() ? '/admin/tempahan/baru' : '/borang/tempahan') + '?' + s;
  }

  // ================================================================== Slip tempahan (cetak / simpan PDF)

  /** @param {Object} s { refNo, statusLabel, nama, noStaf, noTelefon, ruang, blok, aras, kod, pic, tarikh, tarikhTamat, masaMula, masaTamat, peserta, tujuan, oleh, pada } */
  function printSlip(s) {
    const rows = [
      ['Pemohon', s.nama], ['No. Staf', s.noStaf], ['No. telefon', s.noTelefon],
      ['Ruang', s.ruang + (s.blok && String(s.ruang).indexOf('(' + s.blok + ')') < 0 ? ' (' + s.blok + ')' : '')],
      ['Lokasi', [s.aras ? t('Aras') + ' ' + s.aras : '', s.kod].filter(Boolean).join(' · ')],
      ['Tarikh', s.tarikhTamat && s.tarikhTamat !== s.tarikh ? longDay(s.tarikh) + ' – ' + longDay(s.tarikhTamat) : longDay(s.tarikh)],
      ['Masa', s.masaMula + ' – ' + s.masaTamat + (s.tarikhTamat && s.tarikhTamat !== s.tarikh ? ' (' + t('setiap hari') + ')' : '')],
      ['Bilangan peserta', s.peserta ? s.peserta + ' ' + t('orang') : ''], ['Tujuan', s.tujuan], ['PIC ruang', s.pic],
      ['Diluluskan oleh', [s.oleh, fmtIso(s.pada)].filter(Boolean).join(' · ')]
    ].filter((r) => r[1]);
    let box = qs('#tp-print');
    if (!box) { box = document.createElement('div'); box.id = 'tp-print'; document.body.appendChild(box); }
    box.innerHTML = html`<div class="slip">
      <div class="slip__head"><div><h1>${t(cfg().SYSTEM_NAME || '')}</h1><p>${t(cfg().ORG_NAME || '')}</p></div></div>
      <div class="slip__body">
        <p class="slip__title">${t('Slip pengesahan tempahan ruang')}</p>
        <p class="slip__ref">${s.refNo}</p><span class="slip__status">${t(s.statusLabel)}</span>
        <table>${rows.map((r) => html`<tr><th>${t(r[0])}</th><td>${r[1]}</td></tr>`)}</table>
        <div class="slip__note">${t('Sila bawa slip ini (cetak atau di telefon) dan tunjukkan kepada PIC ruang jika diminta. Tempahan tertakluk kepada peraturan penggunaan ruang FKM.')}</div>
      </div>
      <div class="slip__foot"><span>${t('Dicetak pada')} ${fmtIso(new Date().toISOString())}</span><span>${t('Semak status')}: ${t('No. Rujukan')} + ${t('No. Staf')}</span></div>
    </div>`.s;
    document.body.classList.add('tp-printing');
    const done = () => { document.body.classList.remove('tp-printing'); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(() => { window.print(); setTimeout(done, 1000); }, 50);
  }
  const printable = (status) => status === 'DILULUSKAN' || status === 'SELESAI';

  /* Butang "Cetak slip" pada halaman butiran tempahan (admin) */
  let lastDetail = null;
  KD.detailActions.tempahan = (d) => {
    lastDetail = d;
    return printable(d.status) ? html`<button class="btn btn-outline" type="button" data-tp-slip>${icon('download')}Cetak slip</button>` : '';
  };
  document.addEventListener('click', (e) => {
    if (!e.target.closest || !e.target.closest('[data-tp-slip]') || !lastDetail) return;
    const d = lastDetail;
    const v = d.values || {};
    printSlip({
      refNo: d.refNo, statusLabel: d.statusLabel, nama: v.nama, noStaf: v.noStaf, noTelefon: v.noTelefon,
      ruang: (d.labels && d.labels.ruang) || '', tarikh: v.tarikh, tarikhTamat: v.tarikhTamat, masaMula: v.masaMula, masaTamat: v.masaTamat,
      peserta: v.bilanganPeserta, tujuan: v.tujuan, oleh: d.statusChangedBy, pada: d.statusChangedAt
    });
  });

  // ================================================================== Kalendar ketersediaan

  KD.views.jadual = {
    async render(el, params, query) {
      const st = {
        mode: query.mode === 'ruang' ? 'ruang' : 'tarikh',
        tarikh: isKey(query.tarikh) ? query.tarikh : todayKey(),
        ruang: query.ruang || '', blok: query.blok || '', jenis: query.jenis || '', q: query.q || ''
      };
      let data = null;
      const segOf = (b, range) => {
        const s = Math.max(mins(b.masaMula), range[0]);
        const e = Math.min(mins(b.masaTamat), range[1]);
        return { left: ((s - range[0]) / (range[1] - range[0])) * 100, width: Math.max(0, ((e - s) / (range[1] - range[0])) * 100) };
      };

      const shell = () => {
        el.innerHTML = html`${top()}<main class="jd-page">
          <div class="jd-head"><div><h1>${t('Kalendar ketersediaan')}</h1>
            <p>${t('Bar hijau = kosong. Klik pada ruang kosong dalam bar, atau butang Tempah, untuk membuka borang yang telah diisi.')}</p></div>
            ${isAdminLayout() ? html`<a class="btn btn-outline" href="#/papan" target="_blank" rel="noopener">${icon('grid')}Papan paparan</a>` : html`<div class="row row-wrap"><a class="btn btn-outline" href="#/semak">${icon('search')}${t('Semak / batal')}</a><a class="btn btn-primary" href="#/borang/tempahan">${icon('send')}${t('Mohon tempahan')}</a></div>`}</div>
          <div class="jd-bar">
            <div class="segmented" role="group" aria-label="${t('Paparan')}">
              <button type="button" data-mode="tarikh" aria-pressed="${String(st.mode === 'tarikh')}">${t('Ikut tarikh')}</button>
              <button type="button" data-mode="ruang" aria-pressed="${String(st.mode === 'ruang')}">${t('Ikut ruang')}</button>
            </div>
            <div class="jd-date">
              <button type="button" class="icon-btn" data-act="prev" aria-label="${t('Sebelum')}">${icon('chev-left')}</button>
              <input class="input" type="date" name="tarikh" value="${st.tarikh}" aria-label="${t('Tarikh')}">
              <button type="button" class="icon-btn" data-act="next" aria-label="${t('Seterusnya')}">${icon('chev-right')}</button>
              <button type="button" class="btn btn-ghost btn-sm" data-act="today">${t('Hari ini')}</button>
            </div>
          </div>
          <div class="jd-bar" data-filters></div>
          <div class="jd-legend" data-legend></div>
          <div data-body>${skeletonList(3)}</div>
        </main>`.s;
      };

      const filtersHtml = () => {
        const rooms = data.ruang;
        const bloks = Array.from(new Set(rooms.map((r) => r.blok).filter(Boolean))).sort();
        const jenis = Array.from(new Set(rooms.map((r) => r.jenis).filter(Boolean))).sort();
        if (st.mode === 'ruang') {
          return html`<select class="select" name="ruang" aria-label="${t('Ruang')}">${rooms.map((r) => html`<option value="${r.id}" ${r.id === st.ruang ? 'selected' : ''}>${r.nama}${r.blok ? ' · ' + r.blok : ''}</option>`)}</select>`;
        }
        return html`<input class="input" type="search" name="q" value="${st.q}" placeholder="${t('Cari nama ruang')}" aria-label="${t('Cari nama ruang')}">
          <select class="select" name="blok" aria-label="${t('Blok')}"><option value="">${t('Semua blok')}</option>${bloks.map((b) => html`<option ${b === st.blok ? 'selected' : ''}>${b}</option>`)}</select>
          <select class="select" name="jenis" aria-label="${t('Jenis')}"><option value="">${t('Semua jenis')}</option>${jenis.map((j) => html`<option value="${j}" ${j === st.jenis ? 'selected' : ''}>${t(j)}</option>`)}</select>`;
      };

      const axis = (range) => {
        const out = [];
        for (let m = range[0]; m <= range[1]; m += 120) out.push(m);
        return html`<div class="jd-axis" aria-hidden="true">${out.map((m) => html`<span style="left:${((m - range[0]) / (range[1] - range[0])) * 100}%">${hm(m).slice(0, 2)}</span>`)}</div>`;
      };

      const track = (roomId, day, list, range, past) => {
        const segs = list.slice().sort((a, b) => (a.masaMula < b.masaMula ? -1 : 1));
        const label = segs.length ? segs.map((b) => b.masaMula + '–' + b.masaTamat + (b.status === 'MENUNGGU' ? ' (' + t('menunggu') + ')' : '')).join(' · ') : '';
        return {
          bar: html`<div class="jd-track ${past ? 'is-past' : ''}" data-ruang="${roomId}" data-tarikh="${day}" ${past ? '' : html`tabindex="0" role="button"`} aria-label="${dayLabel(day)}: ${label || t('kosong')}">
            ${segs.map((b) => {
              const g = segOf(b, range);
              const tip = b.masaMula + '–' + b.masaTamat + ' · ' + t(STATUS_TEXT[b.status] || b.status) + (b.refNo ? ' · ' + b.refNo + ' · ' + b.nama + ' · ' + b.tujuan : '');
              const style = 'left:' + g.left.toFixed(3) + '%;width:' + g.width.toFixed(3) + '%';
              return b.id
                ? html`<a class="jd-seg ${STATUS_CLASS[b.status] || ''}" style="${style}" title="${tip}" href="#/admin/tempahan/${b.id}">${b.masaMula}</a>`
                : html`<span class="jd-seg ${STATUS_CLASS[b.status] || ''}" style="${style}" title="${tip}">${g.width > 9 ? b.masaMula : ''}</span>`;
            })}</div>`,
          text: label ? html`${t('Ditempah')}: ${label}` : (past ? html`${t('Tiada tempahan')}` : html`<span class="jd-free">${t('Kosong sepanjang hari')}</span>`)
        };
      };

      /* Tarikh tutup (cuti) → tiada tempahan; bukan hari operasi → borang awam ditutup (admin masih boleh) */
      const closedInfo = (day) => {
        const c = (data.tutup || []).filter((x) => x.t === day)[0];
        if (c) return { cuti: true, n: c.n };
        if (data.hariOperasi && data.hariOperasi.indexOf(parseKey(day).getDay()) < 0) return { cuti: false, n: '' };
        return null;
      };
      const blocked = (day) => { const c = closedInfo(day); return !!c && (c.cuti || !isAdminLayout()); };
      const closedNote = (c) => (c.cuti ? t('Ditutup') + (c.n ? ': ' + c.n : '') : t('Bukan hari operasi'));

      const bodyByDate = (range, today) => {
        const q = st.q.trim().toLowerCase();
        const rooms = data.ruang.filter((r) => (!st.blok || r.blok === st.blok) && (!st.jenis || r.jenis === st.jenis) && (!q || (r.nama + ' ' + (r.kodRuang || '')).toLowerCase().indexOf(q) >= 0));
        if (!rooms.length) return empty(t('Tiada ruang'), t('Tiada ruang sepadan dengan penapis.'));
        const groups = {};
        rooms.forEach((r) => { (groups[r.blok || '-'] = groups[r.blok || '-'] || []).push(r); });
        const past = st.tarikh < today || blocked(st.tarikh);
        const ci = closedInfo(st.tarikh);
        return html`<p class="small mb-2" style="font-weight:600">${dayLabel(st.tarikh)}${st.tarikh === today ? ' (' + t('hari ini') + ')' : ''}</p>
          ${ci ? html`<div class="alert ${ci.cuti ? 'alert-danger' : 'alert-warn'} mb-4">${icon('info')}<span>${closedNote(ci)}${!ci.cuti && isAdminLayout() ? ' · ' + t('pentadbir masih boleh menempah') : ''}</span></div>` : ''}
          ${Object.keys(groups).sort().map((g) => html`<section class="panel jd-group"><div class="jd-group__head"><span>${t('Blok')} ${g}</span><span class="xs muted">${groups[g].length} ${t('ruang')}</span></div>
          <div class="jd-row" aria-hidden="true"><span class="jd-axis-spacer"></span>${axis(range)}<span></span></div>
          ${groups[g].map((r) => {
            const tr = track(r.id, st.tarikh, data.tempahan.filter((b) => b.ruang === r.id && b.tarikh <= st.tarikh && b.tarikhTamat >= st.tarikh), range, past);
            return html`<div class="jd-row">
              <div class="jd-room"><b>${r.nama}</b><span class="xs muted">${[t(r.jenis), r.aras ? t('Aras') + ' ' + r.aras : '', r.kapasiti ? r.kapasiti + ' ' + t('orang') : ''].filter(Boolean).join(' · ')}</span></div>
              ${tr.bar}
              ${past ? html`<span></span>` : html`<a class="btn btn-sm btn-outline jd-book" href="${bookHref({ ruang: r.id, tarikh: st.tarikh })}">${t('Tempah')}</a>`}
              <div class="jd-slots">${tr.text}</div>
            </div>`;
          })}</section>`)}`;
      };

      const bodyByRoom = (range, today) => {
        const r = data.ruang.filter((x) => x.id === st.ruang)[0];
        if (!r) return empty(t('Pilih ruang'), t('Pilih ruang untuk melihat jadual 14 hari.'));
        const days = [];
        for (let i = 0; i < 14; i++) days.push(addDays(st.tarikh, i));
        return html`<section class="panel jd-group"><div class="jd-group__head"><span>${r.nama}</span><span class="xs muted">${[r.blok, t(r.jenis), r.kapasiti ? r.kapasiti + ' ' + t('orang') : ''].filter(Boolean).join(' · ')}</span></div>
          <div class="jd-row" aria-hidden="true"><span class="jd-axis-spacer"></span>${axis(range)}<span></span></div>
          ${days.map((d) => {
            const past = d < today || blocked(d);
            const ci = closedInfo(d);
            const dow = parseKey(d).getDay();
            const tr = track(r.id, d, data.tempahan.filter((b) => b.ruang === r.id && b.tarikh <= d && b.tarikhTamat >= d), range, past);
            return html`<div class="jd-row">
              <div class="jd-room"><b class="jd-day ${d === today ? 'is-today' : ''} ${dow === 5 || dow === 6 ? 'is-weekend' : ''}">${shortDay(d)}${d === today ? ' · ' + t('hari ini') : ''}</b>${ci ? html`<span class="xs ${ci.cuti ? '' : 'muted'}" style="${ci.cuti ? 'color:var(--danger)' : ''}">${closedNote(ci)}</span>` : ''}</div>
              ${tr.bar}
              ${past ? html`<span></span>` : html`<a class="btn btn-sm btn-outline jd-book" href="${bookHref({ ruang: r.id, tarikh: d })}">${t('Tempah')}</a>`}
              <div class="jd-slots">${tr.text}</div>
            </div>`;
          })}</section>`;
      };

      const renderBody = () => {
        const range = [mins(data.jam.mula), mins(data.jam.tamat)];
        qs('[data-legend]', el).innerHTML = html`<span><i class="jd-lg-free"></i>${t('Kosong')}</span><span><i class="jd-lg-ok"></i>${t('Ditempah')}</span><span><i class="jd-lg-wait"></i>${t('Menunggu kelulusan')}</span><span class="muted">${t('Waktu operasi')} ${data.jam.mula}–${data.jam.tamat}</span>`.s;
        qs('[data-filters]', el).innerHTML = filtersHtml().s;
        qs('[data-body]', el).innerHTML = (st.mode === 'ruang' ? bodyByRoom(range, data.hariIni) : bodyByDate(range, data.hariIni)).s;
      };

      const sync = () => KD.router.setQuery({ mode: st.mode === 'ruang' ? 'ruang' : '', tarikh: st.tarikh, ruang: st.mode === 'ruang' ? st.ruang : '', blok: st.blok, jenis: st.jenis, q: st.q });

      const load = async () => {
        qs('[data-body]', el).innerHTML = skeletonList(3).s;
        const dateInput = qs('input[name="tarikh"]', el);
        if (dateInput) dateInput.value = st.tarikh;
        qs('[data-mode="tarikh"]', el).setAttribute('aria-pressed', String(st.mode === 'tarikh'));
        qs('[data-mode="ruang"]', el).setAttribute('aria-pressed', String(st.mode === 'ruang'));
        try {
          const p = { dari: st.tarikh, hingga: st.mode === 'ruang' ? addDays(st.tarikh, 13) : st.tarikh };
          if (st.mode === 'ruang' && st.ruang) p.ruang = st.ruang;
          data = await KD.api.call('tempahan.jadual', p);
          if (st.mode === 'ruang' && !st.ruang && data.ruang.length) { st.ruang = data.ruang[0].id; return load(); }
          renderBody();
          sync();
        } catch (err) {
          qs('[data-body]', el).innerHTML = errorState(err, 'reload').s;
        }
      };

      shell();
      on(el, 'click', '[data-mode]', (e, b) => { st.mode = b.getAttribute('data-mode'); load(); });
      on(el, 'click', '[data-act="prev"]', () => { st.tarikh = addDays(st.tarikh, st.mode === 'ruang' ? -14 : -1); load(); });
      on(el, 'click', '[data-act="next"]', () => { st.tarikh = addDays(st.tarikh, st.mode === 'ruang' ? 14 : 1); load(); });
      on(el, 'click', '[data-act="today"]', () => { st.tarikh = todayKey(); load(); });
      on(el, 'click', '[data-act="reload"]', () => load());
      on(el, 'change', 'input[name="tarikh"]', (e, i) => { if (isKey(i.value)) { st.tarikh = i.value; load(); } });
      on(el, 'change', 'select[name="ruang"]', (e, s) => { st.ruang = s.value; load(); });
      on(el, 'change', 'select[name="blok"], select[name="jenis"]', (e, s) => { st[s.name] = s.value; renderBody(); sync(); qs('select[name="' + s.name + '"]', el).focus(); });
      let timer = null;
      on(el, 'input', 'input[name="q"]', (e, i) => {
        clearTimeout(timer);
        timer = setTimeout(() => { st.q = i.value; const pos = i.selectionStart; renderBody(); sync(); const n = qs('input[name="q"]', el); n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) { /* abaikan */ } }, 250);
      });

      /* Klik ruang kosong pada bar → borang dengan masa diisi (slot 1 jam, dihadkan oleh tempahan seterusnya) */
      const pick = (trackEl, clientX) => {
        if (!data || trackEl.classList.contains('is-past')) return;
        const range = [mins(data.jam.mula), mins(data.jam.tamat)];
        const rect = trackEl.getBoundingClientRect();
        const frac = clientX === null ? 0 : Math.min(Math.max((clientX - rect.left) / rect.width, 0), 0.999);
        let start = range[0] + Math.floor((frac * (range[1] - range[0])) / 30) * 30;
        const day = trackEl.getAttribute('data-tarikh');
        const roomId = trackEl.getAttribute('data-ruang');
        const list = data.tempahan.filter((b) => b.ruang === roomId && b.tarikh <= day && b.tarikhTamat >= day && b.status !== 'SELESAI')
          .map((b) => [mins(b.masaMula), mins(b.masaTamat)]).sort((a, b) => a[0] - b[0]);
        const inside = list.filter((x) => start >= x[0] && start < x[1])[0];
        if (inside) start = inside[1];
        if (day === data.hariIni) {
          const now = new Date();
          const nowM = Math.ceil((now.getHours() * 60 + now.getMinutes() + 1) / 30) * 30;
          if (start < nowM) start = nowM;
        }
        if (start >= range[1]) { toast(t('Tiada slot kosong selepas masa ini pada hari tersebut.'), 'error'); return; }
        const next = list.filter((x) => x[0] >= start)[0];
        const end = Math.min(start + 60, range[1], next ? next[0] : range[1]);
        if (end <= start) { toast(t('Slot ini telah ditempah.'), 'error'); return; }
        location.hash = bookHref({ ruang: roomId, tarikh: day, masaMula: hm(start), masaTamat: hm(end) }).slice(1);
      };
      on(el, 'click', '.jd-track', (e, tr) => { if (e.target.closest('a.jd-seg')) return; pick(tr, e.clientX); });
      on(el, 'keydown', '.jd-track', (e, tr) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(tr, null); } });

      await load();
    }
  };

  // ================================================================== Semak / batal / cetak slip (pemohon, tanpa akaun)

  /* ================================================================== Akses pemohon: kod pengesahan emel (OTP)
   * Sesi (token 30 minit) disimpan dalam sessionStorage tab ini sahaja; dikongsi oleh Semak & Tempahan saya. */
  const SES_KEY = KD.utils.nsKey('tpSesi');
  const tpAkses = {
    get() {
      try { const s = JSON.parse(sessionStorage.getItem(SES_KEY) || 'null'); return s && s.exp > Date.now() ? s : null; } catch (e) { return null; }
    },
    set(r, who) {
      const s = { token: r.token, emel: r.emel, who, exp: Date.now() + (Number(r.tamatMinit) || 30) * 60000 - 30000 };
      try { sessionStorage.setItem(SES_KEY, JSON.stringify(s)); } catch (e) { /* abaikan */ }
      return s;
    },
    clear() { try { sessionStorage.removeItem(SES_KEY); } catch (e) { /* abaikan */ } },
    expired: (err) => !!err && err.code === 'FORBIDDEN',
    /**
     * Minta kod & papar langkah memasukkan kod dalam `box`. onOk(sesi) dipanggil selepas kod sah; onBack() kembali ke borang.
     * @param {{noStaf:string, emel?:string, refNo?:string}} req
     */
    async start(box, req, onOk, onBack) {
      await KD.api.call('tempahan.kod', req);
      let wait = 60;
      let timer = null;
      box.innerHTML = html`<div class="panel mt-6 tp-otp" style="padding:var(--sp-5)">
        <div class="row" style="gap:10px;align-items:flex-start">${icon('mail', 'i-lg')}<div><b>${t('Semak emel anda')}</b>
          <p class="small muted mt-2">${t('Jika maklumat sepadan dengan tempahan, kod pengesahan 6 digit telah dihantar ke emel pemohon. Kod sah selama 10 minit.')}</p></div></div>
        <form data-form="otp" class="mt-4" novalidate>
          <div class="field"><label class="label" for="otp-kod">${t('Kod pengesahan')}</label>
            <input class="input" id="otp-kod" name="kod" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="••••••" style="font-size:1.4rem;letter-spacing:.4em;text-align:center"></div>
          <button class="btn btn-primary btn-block" type="submit">${icon('check')}${t('Sahkan')}</button>
        </form>
        <div class="row mt-4" style="justify-content:space-between;flex-wrap:wrap;gap:8px">
          <button class="btn btn-ghost btn-sm" type="button" data-otp="resend" disabled>${t('Hantar semula kod')} <span data-otp-wait>(60)</span></button>
          <button class="btn btn-ghost btn-sm" type="button" data-otp="back">${icon('chev-left', 'i-sm')}${t('Tukar maklumat')}</button>
        </div>
        <p class="xs muted mt-4">${t('Tiada emel? Semak folder Spam/Junk. Jangan kongsi kod ini dengan sesiapa.')}</p></div>`.s;
      const f = qs('[data-form="otp"]', box);
      const resend = qs('[data-otp="resend"]', box);
      const tick = () => {
        wait--;
        const w = qs('[data-otp-wait]', box);
        if (wait <= 0) { clearInterval(timer); resend.disabled = false; if (w) w.textContent = ''; } else if (w) w.textContent = '(' + wait + ')';
      };
      timer = setInterval(tick, 1000);
      setTimeout(() => { try { f.elements.kod.focus(); } catch (e) { /* abaikan */ } }, 50);
      f.elements.kod.addEventListener('input', () => { const v = f.elements.kod.value.replace(/[^0-9]/g, '').slice(0, 6); f.elements.kod.value = v; if (v.length === 6 && f.requestSubmit) f.requestSubmit(); });
      f.addEventListener('submit', (e) => {
        e.preventDefault();
        busy(qs('button[type="submit"]', f), async () => {
          fieldErrors(f, null);
          const kod = f.elements.kod.value.trim();
          if (!/^[0-9]{6}$/.test(kod)) { toast(t('Masukkan kod 6 digit.'), 'error'); return; }
          try {
            const r = await KD.api.call('tempahan.sahKod', Object.assign({ kod }, req));
            clearInterval(timer);
            onOk(tpAkses.set(r, req.noStaf));
          } catch (err) { f.elements.kod.value = ''; if (!fieldErrors(f, err)) toastError(err); }
        });
      });
      on(box, 'click', '[data-otp="resend"]', (e, b) => busy(b, async () => {
        try { await KD.api.call('tempahan.kod', req); toast(t('Kod baharu telah dihantar.')); wait = 60; b.disabled = true; clearInterval(timer); timer = setInterval(tick, 1000); } catch (err) { toastError(err); }
      }));
      on(box, 'click', '[data-otp="back"]', () => { clearInterval(timer); onBack(); });
    }
  };
  KD.tpAkses = tpAkses;

  KD.views.semakTempahan = {
    async render(el, params, query) {
      const m = KD.moduleOf('tempahan');
      const tones = {};
      ((m && m.statuses) || []).forEach((s) => { tones[s.value] = s.tone; });
      el.innerHTML = html`${top()}<main class="auth"><div class="auth-card" style="width:min(580px,100%)">
        <div class="auth-card__head">${icon('search', 'i-lg')}<h2 class="mt-2">${t('Semak / batal tempahan')}</h2><p>${t('Masukkan No. Rujukan dan No. Staf anda. Kod pengesahan akan dihantar ke emel yang digunakan semasa menempah.')}</p></div>
        <form data-form="semak" novalidate>
          <div class="field"><label class="label" for="sk-ref">${t('No. rujukan')}</label><input class="input" id="sk-ref" name="refNo" required maxlength="30" value="${query.ref || ''}" placeholder="${t('cth.')} TP-2026-0001" autocapitalize="characters"></div>
          <div class="field"><label class="label" for="sk-staf">${t('No. Staf')}</label><input class="input" id="sk-staf" name="noStaf" required maxlength="20" inputmode="text" autocomplete="off"></div>
          <button class="btn btn-primary btn-block mt-6" type="submit">${icon('mail')}${t('Hantar kod pengesahan')}</button>
        </form>
        <div data-result></div>
        <p class="xs muted mt-6" style="text-align:center"><a href="#/jadual">${t('Kalendar ketersediaan')}</a> · <a href="#/borang/tempahan">${t('Mohon tempahan baharu')}</a></p>
      </div></main>`.s;
      const form = qs('[data-form="semak"]', el);
      const out = qs('[data-result]', el);
      let current = null;
      let refNo = '';

      const showForm = () => { form.classList.remove('hidden'); out.innerHTML = ''; };
      const show = (v) => {
        current = v;
        form.classList.add('hidden');
        out.innerHTML = html`<div class="panel mt-6" style="padding:var(--sp-5)">
          <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px"><span class="rec-ref" style="margin:0">${v.refNo}</span>${toneBadge(t(v.statusLabel), tones[v.status])}</div>
          <dl class="jd-kv">
            <dt>${t('Ruang')}</dt><dd>${v.ruang}${v.ruangBlok && v.ruang.indexOf('(' + v.ruangBlok + ')') < 0 ? ' (' + v.ruangBlok + ')' : ''}</dd>
            <dt>${t('Tarikh')}</dt><dd>${fmtKey(v.tarikh)}${v.tarikhTamat && v.tarikhTamat !== v.tarikh ? ' – ' + fmtKey(v.tarikhTamat) : ''}</dd>
            <dt>${t('Masa')}</dt><dd>${v.masaMula} – ${v.masaTamat}</dd>
            ${v.bilanganPeserta ? html`<dt>${t('Peserta')}</dt><dd>${v.bilanganPeserta} ${t('orang')}</dd>` : ''}
            <dt>${t('Tujuan')}</dt><dd>${v.tujuan}</dd>
            <dt>${t('Pemohon')}</dt><dd>${v.nama}${v.emel ? html`<br><span class="xs muted">${v.emel}</span>` : ''}</dd>
            ${v.statusNote ? html`<dt>${t('Catatan')}</dt><dd>${v.statusNote}</dd>` : ''}
          </dl>
          ${printable(v.status) ? html`<button class="btn btn-primary btn-block mt-6" type="button" data-act="slip">${icon('download')}${t('Cetak / simpan slip')}</button>` : ''}
          ${v.bolehBatal ? html`<button class="btn btn-outline btn-block mt-3" type="button" data-act="batal" style="color:var(--danger)">${icon('x')}${t('Batalkan tempahan ini')}</button>` : ''}
          <button class="btn btn-ghost btn-block mt-3" type="button" data-act="lain">${icon('search')}${t('Semak tempahan lain')}</button>
        </div>`.s;
      };

      const viewWith = async (ses) => {
        try { show(await KD.api.call('tempahan.semak', { token: ses.token, refNo })); return true; } catch (err) {
          if (tpAkses.expired(err)) tpAkses.clear();
          return false;
        }
      };

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const p = { refNo: form.elements.refNo.value.trim(), noStaf: form.elements.noStaf.value.trim() };
        fieldErrors(form, null);
        if (!p.refNo || !p.noStaf) { toast(t('Isi No. Rujukan dan No. Staf.'), 'error'); return; }
        refNo = p.refNo;
        busy(qs('button[type="submit"]', form), async () => {
          /* Sesi sah sedia ada (No. Staf sama) → terus papar tanpa kod baharu */
          const ses = tpAkses.get();
          if (ses && ses.who === p.noStaf && await viewWith(ses)) return;
          try {
            form.classList.add('hidden');
            await tpAkses.start(out, p, async (s) => { if (!(await viewWith(s))) { toast(t('Tempahan tidak dijumpai.'), 'error'); showForm(); } }, showForm);
          } catch (err) { showForm(); if (!fieldErrors(form, err)) toastError(err); }
        });
      });

      on(out, 'click', '[data-act="lain"]', () => { form.elements.refNo.value = ''; showForm(); form.elements.refNo.focus(); });
      on(out, 'click', '[data-act="slip"]', () => {
        const v = current;
        if (!v) return;
        printSlip({
          refNo: v.refNo, statusLabel: v.statusLabel, nama: v.nama, noStaf: v.noStaf, noTelefon: v.noTelefon, ruang: v.ruang, blok: v.ruangBlok,
          aras: v.ruangAras, kod: v.ruangKod, pic: v.ruangPic, tarikh: v.tarikh, tarikhTamat: v.tarikhTamat, masaMula: v.masaMula, masaTamat: v.masaTamat,
          peserta: v.bilanganPeserta, tujuan: v.tujuan, oleh: v.statusOleh, pada: v.statusPada
        });
      });

      on(out, 'click', '[data-act="batal"]', () => {
        const ses = tpAkses.get();
        if (!current || !ses) { toast(t('Sesi semakan telah tamat. Sila minta kod pengesahan baharu.'), 'error'); showForm(); return; }
        const dlg = modal({
          title: t('Batalkan tempahan?'),
          body: html`<p class="small">${t('Tempahan ini akan dibatalkan dan slot dibuka kepada orang lain. Tindakan ini tidak boleh diundur.')} <b>${current.refNo}</b></p>
            <form data-form="batal" novalidate>
              <div class="field mt-4"><label class="label" for="bt-sebab">${t('Sebab (pilihan)')}</label><input class="input" id="bt-sebab" name="sebab" maxlength="300"></div>
            </form>`,
          foot: html`<button class="btn btn-outline" data-close>${t('Tidak')}</button><button class="btn btn-danger" data-ok>${icon('x')}${t('Ya, batalkan')}</button>`
        });
        const f = qs('[data-form="batal"]', dlg.el);
        const submit = async () => {
          await busy(qs('[data-ok]', dlg.el), async () => {
            try {
              const v = await KD.api.call('tempahan.batal', { token: ses.token, refNo: current.refNo, sebab: f.elements.sebab.value.trim() });
              dlg.close();
              show(v);
              toast(t('Tempahan telah dibatalkan. Pengesahan dihantar ke emel anda.'));
            } catch (err) {
              if (tpAkses.expired(err)) { tpAkses.clear(); dlg.close(); showForm(); }
              if (!fieldErrors(f, err)) toastError(err);
            }
          });
        };
        qs('[data-ok]', dlg.el).addEventListener('click', submit);
        f.addEventListener('submit', (e) => { e.preventDefault(); submit(); });
      });

      if (query.ref) qs('#sk-staf', el).focus();
    }
  };

  // ================================================================== Papan paparan (TV / lobi): tempahan diluluskan hari ini

  KD.views.papanTempahan = {
    async render(el, params, query) {

      let lastLoad = 0;
      const blok = query.blok || '';
      const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
      el.innerHTML = html`<div class="pp"><div class="pp__top"><div>
          <div class="pp__brand">${t(cfg().SYSTEM_NAME || '')}${blok ? ' · ' + t('Blok') + ' ' + blok : ''}</div>
          <div class="pp__title">${t('Tempahan ruang hari ini')}</div><div class="pp__date" data-date></div></div>
          <div class="pp__right"><div class="pp__clock" data-clock aria-live="off"></div><div class="pp__stats" data-stats></div></div></div>
        <div class="pp__body" data-body><div class="pp__empty">${t('Memuatkan…')}</div></div>
        <div class="pp__foot"><span>${t('Tempah ruang')}: ${location.host}${location.pathname}</span><span data-updated></span></div></div>`.s;

      const card = (b, room, now) => html`<div class="pp__card ${now ? 'is-now' : ''}">
        <div class="pp__time">${b.masaMula} – ${b.masaTamat}</div>
        <div class="pp__room">${room ? room.nama : ''}</div>
        <div class="pp__what">${b.tujuan || t('Ditempah')}${room && room.aras ? ' · ' + t('Aras') + ' ' + room.aras : ''}</div></div>`;

      const draw = () => {
        if (!data) return;
        const n = nowMin();
        const rooms = {};
        data.ruang.forEach((r) => { rooms[r.id] = r; });
        const today = data.hariIni;
        const list = data.tempahan
          .filter((b) => b.status === 'DILULUSKAN' && b.tarikh <= today && b.tarikhTamat >= today && rooms[b.ruang] && (!blok || rooms[b.ruang].blok === blok))
          .sort((a, b) => (a.masaMula + (rooms[a.ruang].nama || '')).localeCompare(b.masaMula + (rooms[b.ruang].nama || '')));
        const live = list.filter((b) => mins(b.masaMula) <= n && mins(b.masaTamat) > n);
        const next = list.filter((b) => mins(b.masaMula) > n);
        const done = list.length - live.length - next.length;
        const aktif = data.ruang.filter((r) => !blok || r.blok === blok).length;
        qs('[data-stats]', el).innerHTML = html`<span><b>${live.length}</b>${t('sedang digunakan')}</span><span><b>${next.length}</b>${t('akan datang')}</span><span><b>${aktif}</b>${t('ruang aktif')}</span>`.s;
        qs('[data-body]', el).innerHTML = html`
          <section class="pp__sec"><h2><span class="pp__dot"></span>${t('Sedang berlangsung')} (${live.length})</h2>
            ${live.length ? html`<div class="pp__grid">${live.map((b) => card(b, rooms[b.ruang], true))}</div>` : html`<div class="pp__empty">${t('Tiada tempahan sedang berlangsung.')}</div>`}</section>
          <section class="pp__sec"><h2>${t('Seterusnya hari ini')} (${next.length})</h2>
            ${next.length ? html`<div class="pp__grid">${next.map((b) => card(b, rooms[b.ruang], false))}</div>` : html`<div class="pp__empty">${t('Tiada tempahan lagi hari ini.')}</div>`}</section>
          ${done ? html`<div class="pp__empty" style="padding:0">${done} ${t('tempahan telah selesai hari ini.')}</div>` : ''}`.s;
      };

      const tick = () => {
        if (!el.isConnected) { clearInterval(timer); return; }
        const d = new Date();
        qs('[data-clock]', el).textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
        qs('[data-date]', el).textContent = longDay(keyOf(d));
        if (Date.now() - lastLoad > 60000) load(); else if (d.getSeconds() === 0) draw();
      };
      const load = async () => {
        lastLoad = Date.now();
        try {
          data = await KD.api.call('tempahan.jadual', { dari: todayKey(), hingga: todayKey(), papan: true });
          draw();
          const d = new Date();
          qs('[data-updated]', el).textContent = t('Dikemas kini') + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        } catch (err) {
          if (!data) qs('[data-body]', el).innerHTML = errorState(err).s;
        }
      };
      const timer = setInterval(tick, 1000);
      tick();
    }
  };
