<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4F46E5">
  <title>Tiada sambungan</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #F8FAFC; color: #0F172A; }
    .card { max-width: 420px; margin: 24px; padding: 32px; background: #fff; border: 1px solid #E2E8F0; border-radius: 14px; text-align: center; }
    h1 { font-size: 1.3rem; margin: 12px 0 8px; }
    p { color: #64748B; line-height: 1.6; }
    button { margin-top: 16px; padding: 10px 18px; border: 0; border-radius: 8px; background: #4F46E5; color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="icons/icon-192.png" alt="" width="56" height="56" style="border-radius:12px">
    <h1>Tiada sambungan internet</h1>
    <p>Aplikasi ini memerlukan internet untuk memuatkan data terkini. Semak sambungan anda dan cuba semula.</p>
    <button type="button" id="retry">Cuba semula</button>
  </div>
  <script>document.getElementById("retry").addEventListener("click", function () { location.reload(); });</script>
</body>
</html>
