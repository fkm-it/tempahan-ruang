# Deploy autonomi: setiap push ke main →
#   1. CI penuh (ci.yml)
#   2. Apps Script: clasp push + kemas kini deployment SEDIA ADA (URL /exec kekal sama)
#   3. GitHub Pages: binaan web (index, PWA, manifest, ikon) dengan URL Web App yang betul
# Migrasi pangkalan data berjalan automatik pada permintaan pertama selepas deploy (Migration.autoRun).
#
# Persediaan SEKALI (lihat DEPLOYMENT.md §CI):
#   Settings → Secrets and variables → Actions
#     Secret   CLASPRC_JSON   kandungan ~/.clasprc.json selepas `npx clasp login` di PC anda
#     Variable SCRIPT_ID      ID projek Apps Script (Project Settings → Script ID)
#     Variable DEPLOYMENT_ID  ID deployment Web App (Deploy → Manage deployments) — AKFy…
#     Variable FIREBASE_*     (pilihan) nilai awam Firebase untuk notifikasi telefon
#   Settings → Pages → Source: GitHub Actions
# Tanpa SCRIPT_ID, langkah Apps Script dilangkau (cth. repo templat).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  gas:
    name: Apps Script (clasp)
    needs: ci
    if: ${{ vars.SCRIPT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base_url: ${{ steps.url.outputs.base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: URL awam (GitHub Pages)
        id: url
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"; REPO="${GITHUB_REPOSITORY#*/}"
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          if [ -n "${{ vars.PUBLIC_BASE_URL }}" ]; then BASE="${{ vars.PUBLIC_BASE_URL }}";
          elif [ "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" = "$OWNER_LC.github.io" ]; then BASE="https://$OWNER_LC.github.io/";
          else BASE="https://$OWNER_LC.github.io/$REPO/"; fi
          echo "base_url=$BASE" >> "$GITHUB_OUTPUT"
          echo "URL awam: $BASE"
      - name: Tulis DeployInfo.gs
        run: |
          cat > src/config/DeployInfo.gs <<EOS
          /** DITULIS oleh CI — jangan sunting. */
          const DEPLOY_INFO = Object.freeze({
            publicBaseUrl: '${{ steps.url.outputs.base_url }}',
            apiUrl: '$(node -p "(()=>{try{return require('./backend.json').apiUrl||''}catch(e){return ''}})()")',
            commit: '${GITHUB_SHA::7}',
            builtAt: '$(date -u +%Y-%m-%dT%H:%M:%SZ)'
          });
          EOS
      - name: Bina folder Apps Script (komen skrip frontend dibuang)
        run: node tools/build-gas.js --out build/gas
      - name: Kelayakan clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Secret CLASPRC_JSON belum ditetapkan (lihat DEPLOYMENT.md)"; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"build/gas"}\n' "${{ vars.SCRIPT_ID }}" > .clasp.json
          npm install --no-save --no-audit --no-fund @google/clasp@3
      - name: clasp push
        run: npx clasp push --force
      - name: Kemas kini deployment (URL kekal sama)
        if: ${{ vars.DEPLOYMENT_ID != '' }}
        run: npx clasp update-deployment "${{ vars.DEPLOYMENT_ID }}" --description "CI ${GITHUB_SHA::7} $(date -u +%F)"
      - name: Buang kelayakan
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json

  edge:
    name: Supabase Edge Function
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy fungsi api (jika backend.json & SUPABASE_ACCESS_TOKEN wujud)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ ! -f backend.json ]; then echo "Tiada backend.json — dilangkau."; exit 0; fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Secret SUPABASE_ACCESS_TOKEN belum ditetapkan (Supabase → Account → Access Tokens)"; exit 1; fi
          node tools/build-edge.js
          REF=$(node -p "require('./backend.json').projectRef")
          set +e
          npx --yes supabase@2 functions deploy api --project-ref "$REF" --no-verify-jwt --use-api > deploy.log 2>&1
          CODE=$?
          cat deploy.log
          if [ $CODE -ne 0 ]; then
            # Log Actions tidak boleh dibaca melalui API — tunjuk punca sebagai anotasi
            tail -n 15 deploy.log | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::$line"; done
            exit $CODE
          fi
      - name: Semak fungsi hidup
        run: |
          if [ ! -f backend.json ]; then exit 0; fi
          URL=$(node -p "require('./backend.json').apiUrl")
          for i in 1 2 3 4 5; do curl -sf "$URL" && exit 0; sleep 5; done; exit 1

  pages:
    name: GitHub Pages (web + PWA)
    needs: [ci, gas, edge]
    if: ${{ always() && needs.ci.result == 'success' && needs.gas.result != 'failure' && needs.edge.result != 'failure' && vars.DEPLOYMENT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bina web
        env:
          WEB_APP_URL: https://script.google.com/macros/s/${{ vars.DEPLOYMENT_ID }}/exec
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_VAPID_KEY: ${{ vars.FIREBASE_VAPID_KEY }}
        run: node tools/build-web.js --out web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Terbit
        id: deployment
        uses: actions/deploy-pages@v4
